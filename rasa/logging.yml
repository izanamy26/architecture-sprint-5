   version: 1
   formatters:
     simple:
       format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'

   handlers:
     console:
        class: logging.StreamHandler
        formatter: simple
        level: DEBUG
        stream: ext://sys.stdout

     file_handler:
       class: logging.FileHandler
       formatter: simple
       filename: rasa_debug.log
       level: DEBUG

   root:
     level: DEBUG
     handlers: [console, file_handler]

   loggers:
     rasa:
       level: DEBUG
       handlers: [console, file_handler]
       propagate: false

     rasa_core:
       level: DEBUG
       handlers: [console, file_handler]
       propagate: false

     rasa_nlu:
       level: DEBUG
       handlers: [console, file_handler]
       propagate: false
   
   